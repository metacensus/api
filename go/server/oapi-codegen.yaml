# oapi-codegen reads protoc-gen-openapi's OpenAPI 3 document directly -- no
# conversion stands between them. Run by `make gen`; the path it is given is on
# the command line, not here.
package: server
output: go/server/server.gen.go
generate:
  # strict-server gives handlers typed request and response objects. Without
  # it, chi-server alone emits func(w http.ResponseWriter, r *http.Request) --
  # route coverage, and nothing more.
  strict-server: true
  chi-server: true
  models: true
output-options:
  skip-prune: true
