        Member:
            type: object
            properties:
                id:
                    type: string
                    description: The member's user id, not an id of the membership itself.
                joined:
                    type: string
                    description: When the user joined the topic.
                    format: date-time
            description: |-
                Member is a user's membership of a topic. No backend implements the member
                 routes yet.
        MemberList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member'
        Prop:
            type: object
            properties:
                id:
                    type: string
                authorId:
                    type: string
                created:
                    type: string
                    format: date-time
                type:
                    enum:
                        - Unspecified
                        - Statement
                        - TopicQuestion
                        - TopicChange
                        - UserAdmit
                        - UserExpulse
                        - PaperExtractionComplete
                        - PaperIncludeMetaAnalysis
                    type: string
                    format: enum
                description:
                    type: string
                    description: The text of the proposition, and the text `Vote.citations` index into.
            description: |-
                Prop is a motion a topic's members vote on. It can be functional, changing
                 the topic, or simply establish consensus.
        PropCitation:
            type: object
            properties:
                start:
                    type: integer
                    format: uint32
                end:
                    type: integer
                    format: uint32
            description: PropCitation is a half-open character range in a prop's `description`.
        PropCreateRequest:
            type: object
            properties:
                topicId:
                    type: string
                type:
                    enum:
                        - Unspecified
                        - Statement
                        - TopicQuestion
                        - TopicChange
                        - UserAdmit
                        - UserExpulse
                        - PaperExtractionComplete
                        - PaperIncludeMetaAnalysis
                    type: string
                    format: enum
                description:
                    type: string
            description: 'PropCreateRequest takes no author: it is the authenticated user.'
        PropList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Prop'
        Protocol:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                protocolSections:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProtocolSection'
            description: Protocol is an ordered set of sections, each an ordered set of elements.
        ProtocolCreateRequest:
            type: object
            properties:
                topicId:
                    type: string
                title:
                    type: string
                sections:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProtocolSection'
            description: ProtocolCreateRequest ignores the ids on its sections and elements.
        ProtocolElement:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                type:
                    type: string
                    description: |-
                        An HTML input type, used verbatim as `<input type=…>`: `text`, `number`,
                         `date`, `textarea`, `radio` or `checkbox`.
                label:
                    type: string
                placeholder:
                    type: string
                required:
                    type: boolean
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProtocolElementOption'
                    description: Only meaningful for `radio` and `checkbox`.
                sortOrder:
                    type: integer
                    format: int32
        ProtocolElementOption:
            type: object
            properties:
                name:
                    type: string
                value:
                    type: string
            description: ProtocolElementOption is one choice of a radio or checkbox element.
        ProtocolSection:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                sortOrder:
                    type: integer
                    format: int32
                protocolElements:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProtocolElement'
            description: ProtocolSection is a titled group of elements, ordered by `sort_order`.
        Session:
            type: object
            properties:
                token:
                    type: string
                    description: 'Bearer token, sent back as `Authorization: Bearer <token>`.'
        SignUpRequest:
            type: object
            properties:
                name:
                    type: string
                email:
                    type: string
                country:
                    type: string
                password:
                    type: string
        Topic:
            type: object
            properties:
                id:
                    type: string
                created:
                    type: string
                    format: date-time
                name:
                    type: string
                description:
                    type: string
            description: Topic is a systematic review in progress.
        TopicCreateRequest:
            type: object
            properties:
                name:
                    type: string
                description:
                    type: string
        TopicList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Topic'
        User:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                email:
                    type: string
                country:
                    type: string
                created:
                    type: string
                    format: date-time
        UserList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
        Vote:
            type: object
            properties:
                propId:
                    type: string
                userId:
                    type: string
                position:
                    enum:
                        - Unspecified
                        - For
                        - Against
                        - Abstain
                    type: string
                    format: enum
                explanation:
                    type: string
                    description: Free-text rationale.
                citations:
                    type: array
                    items:
                        $ref: '#/components/schemas/PropCitation'
                    description: |-
                        Spans of the prop's `description` the voter highlighted. Meaningful only
                         for an `Against` vote; cleared when the position changes to any other.
                lastCast:
                    type: string
                    description: When the vote was most recently cast. Overwritten on every recast.
                    format: date-time
            description: |-
                Vote is one member's position on one prop, keyed by `(propId, userId)`: a
                 second vote from the same user replaces the first rather than adding to it.
        VoteList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Vote'
            description: VoteList is the only way to read a prop's votes.
        VoteSetRequest:
            type: object
            properties:
                topicId:
                    type: string
                propId:
                    type: string
                position:
                    enum:
                        - Unspecified
                        - For
                        - Against
                        - Abstain
                    type: string
                    format: enum
                explanation:
                    type: string
                citations:
                    type: array
                    items:
                        $ref: '#/components/schemas/PropCitation'
            description: |-
                VoteSetRequest sets rather than creates: it replaces the caller's previous
                 vote on this prop.
