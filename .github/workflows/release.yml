name: Release

# Tags and publishes a commit on main: the Go module (nothing beyond the tag)
# and the npm package. No container image. Dispatched by `make release`; the
# tag ruleset lets only the release-bot App create a v* tag, so a pushed tag
# is refused rather than published.

run-name: Release ${{ inputs.version || inputs.type }} at ${{ inputs.sha }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      type:
        description: Bump from the latest tag; ignored when version is set
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version (1.2.3); overrides type
        type: string
        default: ''
      sha:
        description: Commit on main to release
        type: string
        required: true
      dry_run:
        description: Check everything, create no tag
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: two runs could otherwise mint the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version and commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags for version.sh's "latest", history for the ancestry check.
          fetch-depth: 0

      - name: Resolve
        id: resolve
        env:
          TYPE: ${{ inputs.type }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          sha="$(git rev-parse --verify "${SHA}^{commit}")"
          # A tag on a commit outside main publishes a version that sits on no
          # branch, which the proxy keeps serving.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          tag="v$(./scripts/version.sh "$VERSION" "$TYPE")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists."
            exit 1
          fi
          echo "Releasing $tag at $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Same suite as every PR, re-run at the commit being released.
  verify:
    name: Verify
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  tag:
    name: Create the tag
    needs: [prepare, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a release-bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.app.outputs.token }}

      - name: Tag and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG#v}"
          git push origin "refs/tags/$TAG"

  publish-npm:
    name: Publish the npm package
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): with a configured trusted publisher,
      # npm >= 11.5.1 mints a credential from this token; no NPM_TOKEN needed.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ts/.nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
          # Public npm; GITHUB_TOKEN only authenticates GitHub Packages.
          registry-url: 'https://registry.npmjs.org'

      - name: Install the TypeScript toolchain
        working-directory: ts
        # --ignore-scripts, not `make deps`: this job holds id-token: write,
        # so a compromised install script must not run next to that credential.
        run: npm ci --ignore-scripts

      - name: Set the package version from the tag
        working-directory: ts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${TAG#v}"
          echo "Publishing version $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build the package
        working-directory: ts
        run: npm run build

      - name: Publish to npm
        working-directory: ts
        run: |
          npm --version
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN secret set — relying on OIDC trusted publishing."
          fi
          # No --tag: publish defaults to `latest`, safe because prepare
          # validated the version as plain semver.
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-go-module:
    name: Verify the Go module is published
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ask the module proxy for the tagged version
        # Indexing is asynchronous, so a miss here is informational, not a failure.
        continue-on-error: true
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          module="github.com/metacensus/api@${TAG}"
          echo "Requesting $module from proxy.golang.org"
          for i in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
                 go list -m "$module"; then
              echo "Go module published: $module"
              exit 0
            fi
            echo "not indexed yet; retrying in 30s ($i/5)"
            sleep 30
          done
          echo "::warning::proxy.golang.org has not indexed $module yet."
          echo "This is normal; it resolves on the first 'go get'."

  github-release:
    name: Create the GitHub release
    needs: [prepare, publish-npm, verify-go-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
