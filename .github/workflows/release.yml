name: Release

# Publishes a tagged version: the Go module (nothing beyond the pushed tag)
# and the npm package. No container image. Then tells the two services, whose
# bump-api.yml opens the go.mod bump (#79).

on:
  push:
    tags:
      # `+` makes this real semver (v1.2.3), not v/v1/v1.2/vnext. No
      # prerelease glob — scripts/version.sh doesn't support prereleases.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Same suite as every PR, re-run at the tagged commit; gates the publish below.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish the npm package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): with a configured trusted publisher,
      # npm >= 11.5.1 mints a credential from this token; no NPM_TOKEN needed.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ts/.nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
          # Public npm; GITHUB_TOKEN only authenticates GitHub Packages.
          registry-url: 'https://registry.npmjs.org'

      - name: Re-validate the tag as semver
        # The trigger's glob is coarser than version.sh's regex; catches an
        # odd tag before it moves the `latest` dist-tag.
        run: ./scripts/version.sh "${GITHUB_REF_NAME}"

      - name: Install the TypeScript toolchain
        working-directory: ts
        # --ignore-scripts, not `make deps`: this job holds id-token: write,
        # so a compromised install script must not run next to that credential.
        run: npm ci --ignore-scripts

      - name: Set the package version from the tag
        working-directory: ts
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Publishing version $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build the package
        working-directory: ts
        run: npm run build

      - name: Publish to npm
        working-directory: ts
        run: |
          npm --version
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN secret set — relying on OIDC trusted publishing."
          fi
          # No --tag: publish defaults to `latest`, safe because the trigger
          # and the semver re-check above both reject any non-release tag.
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-go-module:
    name: Verify the Go module is published
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ask the module proxy for the tagged version
        # Indexing is asynchronous, so a miss here is informational, not a failure.
        continue-on-error: true
        run: |
          module="github.com/metacensus/api@${GITHUB_REF_NAME}"
          echo "Requesting $module from proxy.golang.org"
          for i in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
                 go list -m "$module"; then
              echo "Go module published: $module"
              exit 0
            fi
            echo "not indexed yet; retrying in 30s ($i/5)"
            sleep 30
          done
          echo "::warning::proxy.golang.org has not indexed $module yet."
          echo "This is normal; it resolves on the first 'go get'."

  github-release:
    name: Create the GitHub release
    needs: [publish-npm, verify-go-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # Last, so a service is only told about a version that has fully published.
  # Everything above is done by the time this runs: if it fails, re-run this
  # job alone, or run a service's bump-api.yml by hand with the version.
  dispatch-services:
    name: Tell the services about the release
    needs: [github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GITHUB_TOKEN can't send repository_dispatch to another repository.
      - name: Mint the release-bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: metacensus
          repositories: service-api-standard,service-api-chain

      # Both are tried even if one fails, so one service isn't left behind
      # by the other's outage.
      - name: Dispatch api-release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          failed=""
          for repo in service-api-standard service-api-chain; do
            if gh api "repos/metacensus/$repo/dispatches" \
                 -f event_type=api-release \
                 -f "client_payload[version]=${GITHUB_REF_NAME}"; then
              echo "Dispatched api-release ${GITHUB_REF_NAME} to $repo"
            else
              echo "::error::could not dispatch to $repo"
              failed="$failed $repo"
            fi
          done
          [ -z "$failed" ]
