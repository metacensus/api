name: CI

# Validates the contract: the .proto definition and the Go and TypeScript
# generated from it.
#
# One job: the expensive step is building the pinned buf and protoc-gen-go from
# source, and splitting would pay for it repeatedly.
#
# `workflow_call` is what lets the release gate on this. A tag push does not
# match the triggers below, so release.yml calls this workflow and makes the
# publish job depend on it — an unreviewable npm publish should not be able to
# outrun the checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only the breaking check needed history, and it is commented out
          # below (#14). Kept so that turning it back on stays a matter of
          # uncommenting: it reads the base commit from the local object
          # store, and its tag case needs the tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # internal/tools is where the expensive graph lives; cache on both.
          cache-dependency-path: |
            go.sum
            internal/tools/go.sum

      - name: Restore the built code generators
        # Building buf from source is 54s of a ~78s job, and it only changes
        # when internal/tools does.
        uses: actions/cache@v4
        with:
          path: bin
          key: gentools-${{ runner.os }}-${{ hashFiles('internal/tools/go.sum', 'internal/tools/go.mod', 'Makefile') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install the TypeScript toolchain
        run: make deps

      - name: Build the pinned code generators
        run: make tools

      - name: Lint the proto sources
        run: make lint

      - name: Check proto formatting
        run: make format-check

      # Breaking-change detection is off. See #14, which carries the trigger
      # for turning it back on.
      #
      # It compared against the latest release tag. That is the right target
      # once something is published, but nothing consumes this contract and
      # the only tag, v0.1.0, exists to exercise the release path rather than
      # to promise anything — so a throwaway tag became the baseline for every
      # branch. Removing paper.proto (#9) has failed the step on main and on
      # every open PR since. Because it sits here, that failure aborts the job
      # before the tests, the build, the TypeScript check and the freshness
      # diff ever run: the whole suite was being spent to guard a
      # compatibility promise nobody has been made.
      #
      # Unguarded until it comes back: renumbered fields, changed types,
      # removed fields, deleted files. `make breaking` still works and can be
      # run by hand, and proto/buf.yaml's `breaking` config is untouched, so
      # this is a step to uncomment rather than one to rebuild. #14 also
      # records the release-workflow bug that has to be fixed at the same
      # time — a tag push compares against the preceding tag, so a release
      # carrying a deliberate break fails its own gate, and the Go module
      # publishes from the tag regardless.
      #
      # - name: Check for breaking changes
      #   # Compare against the latest release tag, not the merge base.
      #   #
      #   # The contract is what has been published; unreleased main is not a
      #   # promise to anyone. This asks a question about state — "does the
      #   # schema as it stands break the released contract?" — rather than
      #   # about a diff, so the answer does not depend on which base the PR
      #   # happens to have, and it is the question consumers actually care
      #   # about. With no tags yet, nothing is released, so there is nothing
      #   # to break and the target no-ops. On a tag push, compare against the
      #   # tag immediately preceding this one, so the release itself is
      #   # checked.
      #   run: |
      #     if [ "${{ github.ref_type }}" = "tag" ]; then
      #       against="$(git tag -l 'v*' --sort=v:refname \
      #         | awk -v cur="${{ github.ref_name }}" \
      #               '$0 == cur { exit } { last = $0 } END { print last }')"
      #     else
      #       against="$(git tag -l 'v*' --sort=v:refname | tail -1)"
      #     fi
      #     echo "comparing against ${against:-<nothing released yet>}"
      #     make breaking BREAKING_AGAINST="$against"

      - name: Regenerate everything
        run: make gen

      - name: Fail if the checked-in output is stale
        run: |
          if ! git diff --exit-code; then
            echo
            echo "The committed output does not match the .proto sources."
            echo "Run 'make gen' and commit the result."
            exit 1
          fi
          # A new generated file is untracked, so the diff above misses it.
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "Generation produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Build and vet the Go module
        run: |
          go build -o /dev/null ./...
          go vet ./...

      - name: Run the schema and route invariants
        run: go test ./...

      - name: Type-check the TypeScript and assert it has no runtime
        working-directory: ts
        run: npm run check

      - name: Build the npm package
        # Not published here — this only proves the publish build compiles, so a
        # broken build fails on the PR rather than at release time.
        working-directory: ts
        run: npm run build
