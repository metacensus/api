name: CI

# Validates the .proto contract and its generated Go/TS. One job because
# building buf/protoc-gen-go from source is the expensive part and splitting
# would pay for it repeatedly. `workflow_call` lets release.yml gate its
# publish on this.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: only the (currently disabled, #14) breaking check
          # needs it, kept so re-enabling is just an uncomment.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # routegen is where the expensive graph lives; cache on both
          # modules, since each resolves its own.
          cache-dependency-path: |
            go.sum
            routegen/go.sum

      - name: Restore the built code generators
        # Building buf from source is 54s of a ~78s job, and it only changes
        # when routegen's requirements do.
        uses: actions/cache@v4
        with:
          path: bin
          key: gentools-${{ runner.os }}-${{ hashFiles('routegen/go.sum', 'routegen/go.mod', 'Makefile') }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ts/.nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install the TypeScript toolchain
        run: make deps

      - name: Build the pinned code generators
        run: make tools

      # Breaking-change detection is disabled; see README.md, "What breaking
      # is measured against", and #14 for why and what re-enables it.
      #
      # - name: Check for breaking changes
      #   run: |
      #     if [ "${{ github.ref_type }}" = "tag" ]; then
      #       against="$(git tag -l 'v*' --sort=v:refname \
      #         | awk -v cur="${{ github.ref_name }}" \
      #               '$0 == cur { exit } { last = $0 } END { print last }')"
      #     else
      #       against="$(git tag -l 'v*' --sort=v:refname | tail -1)"
      #     fi
      #     echo "comparing against ${against:-<nothing released yet>}"
      #     make breaking BREAKING_AGAINST="$against"

      # Fetched here (not in the Makefile) so no target reaches the network silently.
      - name: Fetch the deployed baseline for the public surface
        run: git fetch -q --no-tags origin main

      # `make check` — not a re-spelled list of steps — so CI and a local
      # `make check` can't drift. Includes `breaking-public`, which still
      # enforces even though the released-contract check above is off (#14).
      - name: Check
        # Empty baseline on a tag disables breaking-public: the comparison
        # would otherwise run backwards (a tag can sit behind origin/main).
        env:
          PUBLIC_BREAKING_AGAINST: ${{ github.ref_type == 'tag' && '' || 'origin/main' }}
        run: make check

      # Left out of `make check`: a question about the commit, not the code.
      - name: Regenerate everything
        run: make gen

      - name: Fail if the checked-in output is stale
        run: |
          if ! git diff --exit-code; then
            echo
            echo "The committed output does not match the .proto sources."
            echo "Run 'make gen' and commit the result."
            exit 1
          fi
          # A new generated file is untracked, so the diff above misses it.
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "Generation produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
