name: Bug
description: The system disagrees with what it should do. Task-sized.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `sdlc` skill](https://github.com/metacensus/skills/blob/main/skills/sdlc/SKILL.md).

  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The command that fails now and passes once this is fixed.
      render: shell
