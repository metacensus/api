version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  except:
    # Enum values cross the wire as their own names, so they are PascalCase.
    - ENUM_VALUE_UPPER_SNAKE_CASE
    # Enums are nested in the message that owns them instead.
    - ENUM_VALUE_PREFIX
  enum_zero_value_suffix: Unspecified

breaking:
  use:
    - FILE
