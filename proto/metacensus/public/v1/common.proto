// Shared types for the public surface. See README.md, "The two surfaces" and
// "Errors on the two surfaces".
//
// The statuses this surface answers with, which `google.api.http` cannot
// express and so live nowhere else. 400 and 403 share a sentence on purpose:
// which applies is not a caller's business.
//
//   400  the submission was not valid, or the body was not JSON
//   403  the `Origin` was absent or not allowlisted
//   413  the body exceeded 16 KiB
//   429  the per-client rate limit was exceeded; `Retry-After` carries seconds
//   502  the submission could not be relayed upstream
//   500  something else went wrong
//
// No messages yet: this is the one file the cross-file typing rule exempts, so
// a type shared across the surface's resources would go here.
syntax = "proto3";

package metacensus.public.v1;

option go_package = "github.com/metacensus/api/go/metacensus/public/v1;metacensuspublicv1";
