// Shared types for the public surface, and where the surface-wide answers
// live.
//
// Neither surface types its failures; the HTTP status is the signal. Below
// are the statuses this surface answers with, on every route and on paths
// no route claims (404, 405) — prose because `google.api.http` cannot
// express responses. See README.md, "The two surfaces" and "Errors on the
// two surfaces", for why.
//
//   400  the submission was not valid, or the body was not JSON
//   403  the `Origin` was absent or not allowlisted
//   413  the body exceeded 16 KiB
//   429  the per-client rate limit was exceeded; `Retry-After` carries seconds
//   502  the submission could not be relayed upstream
//   500  something else went wrong
//
// No messages yet: this file is the cross-file typing rule's one exemption,
// so it's where a type shared across this surface's resources would go.
syntax = "proto3";

package metacensus.public.v1;

option go_package = "github.com/metacensus/api/go/metacensus/public/v1;metacensuspublicv1";
