// The partner / express-interest form the marketing site posts to.
syntax = "proto3";

package metacensus.public.v1;

import "google/api/annotations.proto";

option go_package = "github.com/metacensus/api/go/metacensus/public/v1;metacensuspublicv1";

// Route declarations, not a gRPC commitment: see README.md.
//
// Paths are relative to `/metacensus/public`, which routegen holds in
// model.Packages.
service PartnerRoutes {
  // Rejections answer with a status and an untyped body; see common.proto.
  rpc SubmitPartnerInterest(PartnerSubmission) returns (PartnerReceipt) {
    option (google.api.http) = {
      post: "/partner"
      body: "*"
    };
  }
}

// PartnerSubmission is one express-interest form post.
//
// The length caps below are the contract's only statement of the limits: the
// failure is opaque, so a client must know them in advance, and they are
// comments rather than protovalidate constraints for the reason in README.md,
// "What the public contract does and does not mechanise".
message PartnerSubmission {
  // Interest is the set of checkboxes the form offers. The set is the contract;
  // the display labels stay in the SPA as copy. `Unspecified` is the proto3
  // zero value, not an offered choice — a form must filter it out. See
  // README.md, "What the public contract does and does not mechanise".
  enum Interest {
    Unspecified = 0;

    // "Partner or pilot with us"
    PartnerOrPilot = 1;

    // "Fund the work"
    FundTheWork = 2;

    // "Contribute expertise"
    ContributeExpertise = 3;

    // "Bring MetaCensus to my field"
    BringToMyField = 4;

    // "Request early access"
    RequestEarlyAccess = 5;
  }

  // Required. Whitespace-collapsed, then capped at 120 characters.
  string name = 1;

  // Required. Trimmed, capped at 254 characters, and must contain an `@` with
  // a dotted host after it. Deliberately a shape check, not RFC 5322.
  string email = 2;

  // May be empty. Duplicates are collapsed rather than rejected; an
  // unrecognised value rejects the whole submission.
  repeated Interest interests = 3;

  // Optional. Trimmed, capped at 2000 characters.
  string message = 4;

  // Honeypot. Must be empty; a filled one receives an ordinary receipt and is
  // never delivered.
  string website = 5;
}

// PartnerReceipt is the 200 answer. `submissionId` correlates a submission with
// the service's logs; it is not a handle, and nothing can be fetched with it.
message PartnerReceipt {
  // Always true. Kept because the service sends it and UnmarshalOptions rejects
  // unknown fields, so dropping it is a service change first. See README.md,
  // "The one shape that still differs".
  bool ok = 1;

  string submission_id = 2;
}
