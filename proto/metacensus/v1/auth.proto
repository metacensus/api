// Sign-up, login and logout.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see README.md.
//
// Login and Logout move no signable content; SignUp carries a signature and is
// where the key arrives. The exempt writes are `unsignedWrites` in
// go/signing_test.go. Which routes require a session token is the middleware's,
// per implementation. See README.md, "The signing chain".
service AuthRoutes {
  rpc Login(LoginRequest) returns (Session) {
    option (google.api.http) = {
      post: "/login"
      body: "*"
    };
  }

  rpc SignUp(SignUpRequest) returns (Session) {
    option (google.api.http) = {
      post: "/signup"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/logout"};
  }
}

message LoginRequest {
  string email = 1;

  string password = 2;
}

// SignUpRequest creates an account and enrols the signing key every later write
// is signed with. It is the one request whose signature carries its own public
// key, because its signer cannot yet be looked up: trust on first use, with
// proof of possession. The service concedes nothing it had not already conceded
// to whoever holds the password; what the signature adds is binding the key to
// the account. See README.md, "Enrolling the key".
message SignUpRequest {
  // What the new user signs, and what their user record will hold verbatim.
  UserContent content = 1;

  // Outside `content`: a password must never be inside a signed, stored document.
  string password = 2;

  // Over `content`, with the key being enrolled: `signer_id` empty, `public_key`
  // inline. The checks persistence owes at enrolment are in README.md, "Open
  // questions".
  UserSignature user_signature = 3;
}

message Session {
  // Bearer token, sent back as `Authorization: Bearer <token>`.
  string token = 1;
}

message LogoutRequest {}

message LogoutResponse {}
