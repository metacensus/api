// Sign-up, login and logout.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see contract/README.md.
service AuthRoutes {
  rpc Login(LoginRequest) returns (Session) {
    option (google.api.http) = {
      post: "/login"
      body: "*"
    };
  }

  rpc SignUp(SignUpRequest) returns (Session) {
    option (google.api.http) = {
      post: "/signup"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/logout"};
  }
}

message LoginRequest {
  string email = 1;

  string password = 2;
}

message SignUpRequest {
  string name = 1;
  string email = 2;
  string country = 3;

  string password = 4;
}

message Session {
  // Bearer token, sent back as `Authorization: Bearer <token>`.
  string token = 1;
}

message LogoutRequest {}

message LogoutResponse {}
