// Sign-up, login and logout.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Login, Refresh and Logout carry no user signature — none moves content a
// participant could vouch for. See `unsignedWrites` in
// go/contract/signing_test.go for which writes are exempt and why.
service AuthRoutes {
  rpc Login(LoginRequest) returns (Session) {
    option (google.api.http) = {
      post: "/login"
      body: "*"
    };
  }

  rpc SignUp(SignUpRequest) returns (Session) {
    option (google.api.http) = {
      post: "/signup"
      body: "*"
    };
  }

  // Exchanges a refresh token for a fresh session. It needs no live access
  // token — it is called precisely when one has expired — so it is mounted
  // outside the bearer middleware; the refresh token is the credential.
  rpc Refresh(RefreshRequest) returns (Session) {
    option (google.api.http) = {
      post: "/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/logout"
      body: "*"
    };
  }
}

message LoginRequest {
  string email = 1;

  string password = 2;
}

// Creates an account and enrolls the signing key every later write is
// signed with: trust on first use — nobody vouches for the key, the service
// binds whatever it's handed, and the signature proves possession of the
// matching private key at enrollment.
message SignUpRequest {
  User content = 1;

  // Deliberately outside `content`: a password must never be inside a
  // signed, stored document.
  string password = 2;

  // Over `content`, made with the key being enrolled. `signer_id` is empty
  // (no id exists yet) and `public_key` carries the key inline.
  UserSignature user_signature = 3;
}

message Session {
  // Short-lived access token, sent back as `Authorization: Bearer <token>`.
  // Opaque; the client cannot read an expiry out of it, which is what
  // `expires_in` is for.
  string token = 1;

  // Seconds until `token` expires, measured from when this response was
  // issued. The client refreshes at or before that horizon (see `/refresh`);
  // it is the only expiry signal, since the token is opaque.
  int32 expires_in = 2;

  // Long-lived credential that mints a fresh access token at `/refresh`,
  // rotated on every use and revoked at logout. In the browser posture it
  // never travels here: the server lifts it into an `HttpOnly` cookie and
  // blanks this field, so JavaScript never holds it. A non-browser caller (a
  // proxy or another server) reads it here instead. See ts/README.md, "Auth
  // and the session token".
  string refresh_token = 3;
}

// Exchanges a refresh token for a fresh session. Cookie or body delivery is as
// on `Session.refresh_token`; a request that carries neither is rejected.
message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  // The refresh token whose session to end — its rotation lineage and its
  // access tokens with it. Cookie or body delivery is as on
  // `Session.refresh_token`.
  string refresh_token = 1;
}

message LogoutResponse {}
