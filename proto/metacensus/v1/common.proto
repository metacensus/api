// Shared types. Derivation, exclusions and open questions:
// contract/DERIVATION.md.
syntax = "proto3";

package metacensus.v1;

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// ListMetadata is the `metadata` half of every list response. Empty: nothing on
// this surface paginates. It exists so that a route can grow pagination without
// breaking consumers, and it is shared by every list, so a field added here is
// added to all of them.
message ListMetadata {}

// Error is the body of any failed request.
message Error {
  string error = 1;
}

// HealthcheckResponse is the body of `GET /healthcheck`.
message HealthcheckResponse {
  string status = 1;
}
