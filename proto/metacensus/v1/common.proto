// Shared types.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see contract/README.md.
service HealthRoutes {
  rpc Healthcheck(HealthcheckRequest) returns (HealthcheckResponse) {
    option (google.api.http) = {get: "/healthcheck"};
  }
}

// ListMetadata is the pagination envelope for list responses. No route
// paginates yet, so nothing references it.
message ListMetadata {
  // 1-based.
  int32 page = 1;

  // Items per page.
  int32 limit = 2;

  // Items across all pages, not just this one.
  int32 total = 3;
}

message HealthcheckRequest {}

message HealthcheckResponse {
  string status = 1;
}
