// Shared types.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Declared as a gRPC service and served over HTTP by grpc-gateway, which
// transcodes from the google.api.http annotations below. No gRPC server runs.
service HealthRoutes {
  rpc Healthcheck(HealthcheckRequest) returns (HealthcheckResponse) {
    option (google.api.http) = {get: "/healthcheck"};
  }
}

// ListMetadata is the pagination envelope for list responses. No route
// paginates yet, so nothing references it.
message ListMetadata {
  // 1-based.
  int32 page = 1;

  // Items per page.
  int32 limit = 2;

  // Items across all pages, not just this one.
  int32 total = 3;
}

// Error is the body of any failed request. `code` is a stable PascalCase
// identifier for the specific failure; the HTTP status carries the category and
// this does not restate it. Codes are added over time, so a client that does not
// recognise one falls back to the status.
message Error {
  string code = 1;
  string error = 2;
}

message HealthcheckRequest {}

message HealthcheckResponse {
  string status = 1;
}
