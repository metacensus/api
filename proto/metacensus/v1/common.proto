// Shared types. Derivation, exclusions and open questions:
// contract/DERIVATION.md.
syntax = "proto3";

package metacensus.v1;

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// ListMetadata is the pagination envelope for list responses. Defined, but
// referenced by nothing: no route paginates yet.
message ListMetadata {
  // 1-based.
  int32 page = 1;

  // Items per page.
  int32 limit = 2;

  // Items across all pages, not just this one.
  int32 total = 3;
}

// Error is the body of any failed request.
message Error {
  string error = 1;
}

// HealthcheckResponse is the body of `GET /healthcheck`.
message HealthcheckResponse {
  string status = 1;
}
