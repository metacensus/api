// Shared types.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see README.md.
service HealthRoutes {
  rpc Healthcheck(HealthcheckRequest) returns (HealthcheckResponse) {
    option (google.api.http) = {get: "/healthcheck"};
  }
}

// ListMetadata is the pagination envelope for list responses. No route
// paginates yet, so nothing references it.
message ListMetadata {
  // 1-based.
  int32 page = 1;

  // Items per page.
  int32 limit = 2;

  // Items across all pages, not just this one.
  int32 total = 3;
}

message HealthcheckRequest {}

message HealthcheckResponse {
  string status = 1;
}

// UserSignature is one participant vouching for one content message. It is not
// verified at the API edge but behind persistence, over the decoded message.
// Every field but `value` is inside the digest, so a signature cannot be
// re-attributed, re-dated or reinterpreted. See README.md, "The signing chain".
message UserSignature {
  // Alg is the signature algorithm. The vocabulary is closed, so an unknown
  // value fails to decode rather than reaching a verifier — which means adding
  // one is a contract release that has to reach every reader before any signer
  // emits it, since an older reader cannot decode a record it does not name.
  enum Alg {
    Unspecified = 0;

    // ECDSA on P-384 with SHA-384. `value` is the JOSE fixed-width `r || s`,
    // never DER.
    Es384 = 1;
  }

  // The signing user's id. Empty only on the sign-up that enrols the key, where
  // no id exists yet and `public_key` carries the key inline. See README.md,
  // "Open questions", for the refusals persistence owes everywhere else.
  string signer_id = 1;

  // base64url, unpadded, of SHA-256 over the SPKI DER of `public_key`. Derived,
  // not minted, so it can be computed before an account exists and checked
  // rather than trusted. Present from v1 so key rotation is a second key, not a
  // reshaping.
  string key_id = 2;

  Alg alg = 3;

  // base64url, unpadded, of the signer's public key as SPKI DER. Inline only on
  // the enrolling sign-up; empty elsewhere, where a verifier resolves `key_id`
  // to the enrolled key. Not PEM: its line breaks would be a second spelling
  // that hashes differently.
  string public_key = 4;

  // When the signer claims it signed — inside the digest, so the participant's
  // to choose. The record's `recorded` time is the server's, outside the
  // signature. The pair bounds the participant, not the server; any tolerance
  // over the difference is a chaincode policy number, since one written here
  // would be a wire break to change. Ordering uses `recorded`, never this.
  google.protobuf.Timestamp signing_time = 5;

  // How to compute and check this signature: `"metacensus.sig/1"` is JCS
  // (RFC 8785) over `{"content": <content>, "signature": <this with value "">}`,
  // digested SHA-384. Inside the signature because a marker outside it could be
  // reinterpreted; changing any of those changes this string.
  string spec = 6;

  // The full proto name of the message in `content`, e.g.
  // `"metacensus.v1.PropContent"`. Separate from `spec`, and what stops a
  // signature being replayed over a different content type of the same shape.
  string content_type = 7;

  // base64url, unpadded, of the signature over the digest. Excluded from its own
  // digest by being emptied rather than dropped; why, in the go/signing package
  // comment.
  string value = 8;
}

// UserContent is the part of a user record its owner signs. It lives here, not
// in user.proto, because two resource files share it: `SignUpRequest` signs it
// at enrolment and `User` stores it, and it must be one message, or a signature
// made at sign-up would not verify against the stored record.
message UserContent {
  string name = 1;
  string email = 2;
  string country = 3;
}
