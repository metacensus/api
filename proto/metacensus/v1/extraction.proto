// Data extraction: the values pulled from one paper against one protocol.
syntax = "proto3";

package metacensus.v1;

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// DataExtraction is the set of values extracted from one paper against one
// protocol, identified by the three ids together. It is both what is upserted
// and what is read back.
message DataExtraction {
  string topic_id = 1;
  string paper_id = 2;
  string protocol_id = 3;
  repeated DatumExtraction data = 4;
}

// DatumExtraction is one answered protocol element.
message DatumExtraction {
  string protocol_element_id = 1;

  // The extracted value. A string for every element type the contract
  // describes; multi-select elements have no representation yet.
  string datum = 2;

  // Where in the PDF the value was read from. Empty when the value was typed
  // rather than selected.
  repeated SourceLocationPage source_location = 3;
}

// SourceLocationPage is the highlighted rectangles on one page of a PDF.
message SourceLocationPage {
  int32 page = 1;
  repeated SourceRect rects = 2;
}

// SourceRect is one highlight rectangle, in the PDF viewer's coordinate space.
message SourceRect {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
}

// DataExtractionGetRequest requires all three fields: together they identify
// one `DataExtraction`.
message DataExtractionGetRequest {
  string topic_id = 1;
  string paper_id = 2;
  string protocol_id = 3;
}
