// Papers: the literature under review in a topic.
syntax = "proto3";

package metacensus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Paper is one piece of literature attached to a topic.
message Paper {
  string id = 1;
  string topic_id = 2;
  string title = 3;

  // Author names, in reading order.
  repeated string authors = 4;

  string abstract = 5;

  // Bibliographic identifiers. Either may be empty: not every paper has both,
  // and one uploaded as a PDF may have neither.
  string doi = 6;
  string pmid = 7;

  google.protobuf.Timestamp created = 8;
}

// PaperListRequest is the body of `POST /paper`. At least one field must be
// set; setting `paper_id` narrows the result to a single paper.
message PaperListRequest {
  string topic_id = 1;
  string paper_id = 2;
}

// PaperList is the response to `POST /paper`.
message PaperList {
  repeated Paper items = 1;
}

// PaperCreateRequest is the JSON body of `POST /paper/create`, which returns
// the created `Paper`. Uploading a PDF is not part of this contract; see
// contract/DERIVATION.md.
message PaperCreateRequest {
  string topic_id = 1;
  string title = 2;
  repeated string authors = 3;
  string abstract = 4;
  string doi = 5;
  string pmid = 6;
}

// PaperLookupRequest is the query string of `GET /paper/lookup`, which fetches
// a PubMed record so the create form can be prefilled from a PMID.
message PaperLookupRequest {
  string pmid = 1;
}

// PaperLookupResponse is the response to `GET /paper/lookup`. Every field is
// whatever PubMed supplied, so any of them may be empty.
message PaperLookupResponse {
  string pmid = 1;
  string title = 2;
  repeated string authors = 3;

  // Labelled sections arrive joined by blank lines and prefixed with their
  // label — `"METHODS: …"` — rather than structured.
  string abstract = 4;

  string doi = 5;
}
