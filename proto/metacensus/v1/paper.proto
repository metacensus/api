// Papers: the literature under review in a topic.
syntax = "proto3";

package metacensus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Paper is one piece of literature attached to a topic.
message Paper {
  string id = 1;
  string topic_id = 2;
  string title = 3;

  // Author names, in reading order.
  repeated string authors = 4;

  string abstract = 5;

  // Bibliographic identifiers. Either may be empty: not every paper has both,
  // and one uploaded as a PDF may have neither.
  string doi = 6;
  string pmid = 7;

  google.protobuf.Timestamp created = 8;
}

// PaperListRequest requires at least one field; setting `paper_id` narrows the
// result to a single paper.
message PaperListRequest {
  string topic_id = 1;
  string paper_id = 2;
}

message PaperList {
  repeated Paper items = 1;
}

// PaperCreateRequest carries no PDF: uploading one is not part of this
// contract. See contract/DERIVATION.md.
message PaperCreateRequest {
  string topic_id = 1;
  string title = 2;
  repeated string authors = 3;
  string abstract = 4;
  string doi = 5;
  string pmid = 6;
}

// PaperLookupRequest names the PubMed record the create form is prefilled
// from.
message PaperLookupRequest {
  string pmid = 1;
}

// PaperLookupResponse is whatever PubMed supplied, so any field may be empty.
message PaperLookupResponse {
  string pmid = 1;
  string title = 2;
  repeated string authors = 3;

  // Labelled sections arrive joined by blank lines and prefixed with their
  // label — `"METHODS: …"` — rather than structured.
  string abstract = 4;

  string doi = 5;
}
