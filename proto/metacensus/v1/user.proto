// Users. Sign-up and login live in auth.proto.
syntax = "proto3";

package metacensus.v1;

import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// User is a MetaCensus account.
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  google.protobuf.Timestamp created = 5;
}

// UserListRequest is the query string of `GET /user`. No parameters.
message UserListRequest {}

// UserList is the response to `GET /user`.
message UserList {
  repeated User items = 1;
  ListMetadata metadata = 2;
}

// UserGetRequest is the path parameter of `GET /user/{userId}`, which returns a
// `User`. `GET /self` returns the authenticated `User` and takes no parameters.
message UserGetRequest {
  string user_id = 1;
}
