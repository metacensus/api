// Users. Sign-up and login live in auth.proto.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see contract/README.md.
service UserRoutes {
  rpc ListUsers(ListUsersRequest) returns (UserList) {
    option (google.api.http) = {get: "/user"};
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/user/{user_id}"};
  }

  rpc GetSelf(GetSelfRequest) returns (User) {
    option (google.api.http) = {get: "/self"};
  }
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  google.protobuf.Timestamp created = 5;
}

message ListUsersRequest {}

message UserList {
  repeated User items = 1;
}

message GetUserRequest {
  string user_id = 1;
}

// GetSelfRequest is empty: the user is the authenticated one.
message GetSelfRequest {}
