// Users. Sign-up and login live in auth.proto.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see README.md.
service UserRoutes {
  rpc ListUsers(UserListRequest) returns (UserList) {
    option (google.api.http) = {get: "/user"};
  }

  rpc GetUser(UserGetRequest) returns (User) {
    option (google.api.http) = {get: "/user/{user_id}"};
  }

  rpc GetSelf(SelfGetRequest) returns (User) {
    option (google.api.http) = {get: "/self"};
  }
}

// User is a signed record, and the key directory: reading a user yields the
// `public_key` its enrolling signature carried, which is how a verifier resolves
// a `key_id`.
message User {
  // Minted by the server, outside the signature: the record's address.
  string id = 1;

  // When the server recorded the write. The server's observation; the claimed
  // time is in UserSignature.signing_time.
  google.protobuf.Timestamp recorded = 2;

  UserContent content = 3;

  UserSignature user_signature = 4;

  // Held for a later institutional signature over `user_signature.value`, so it
  // lands as a pure field addition. `reserved` refuses the number where a comment
  // only asks; every signed record reserves the one after its last.
  reserved 5;
}

message UserListRequest {}

message UserList {
  repeated User items = 1;
}

message UserGetRequest {
  string user_id = 1;
}

// SelfGetRequest is empty: the user is the authenticated one.
message SelfGetRequest {}
