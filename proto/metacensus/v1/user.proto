// Users. Sign-up and login live in auth.proto.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

service UserRoutes {
  rpc ListUsers(UserListRequest) returns (UserList) {
    option (google.api.http) = {get: "/user"};
  }

  rpc GetUser(UserGetRequest) returns (UserSigned) {
    option (google.api.http) = {get: "/user/{user_id}"};
  }

  rpc GetSelf(SelfGetRequest) returns (UserSigned) {
    option (google.api.http) = {get: "/self"};
  }
}

// A signed record. Also the key directory: a user's enrolling key (carried on
// the SignUpRequest that created them) is how a verifier resolves a `key_id` to
// its trust anchor.
message UserSigned {
  // Minted by the server, outside every signature.
  string id = 1;

  // Server's observation; see Signature.time for the author's claim.
  google.protobuf.Timestamp recorded = 2;

  User content = 3;

  // How to read this record; sealed by both signatures below.
  Interpretation interpretation = 4;

  // The participant vouches for `content`.
  Signature user_signature = 5;

  // The institution vouches for `user_signature`; see the Signature type.
  Signature institutional_signature = 6;

  // Held for the next signature layer. `reserved` (not just a comment) is what
  // stops the number being reused; see the reserve-the-next-field rule in
  // go/contract/signing_test.go.
  reserved 7;
}

message UserListRequest {}

message UserList {
  repeated UserSigned items = 1;
}

message UserGetRequest {
  string user_id = 1;
}

// Empty: the user is the authenticated one.
message SelfGetRequest {}
