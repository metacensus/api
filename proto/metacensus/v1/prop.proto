// Propositions and votes: the consensus mechanism.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see README.md.
service PropRoutes {
  rpc ListProps(PropListRequest) returns (PropList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop"};
  }

  rpc GetProp(PropGetRequest) returns (Prop) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}"};
  }

  rpc CreateProp(PropCreateRequest) returns (Prop) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop"
      body: "*"
    };
  }

  rpc ListVotes(VoteListRequest) returns (VoteList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}/vote"};
  }

  rpc SetVote(VoteSetRequest) returns (Vote) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop/{prop_id}/vote"
      body: "*"
    };
  }
}

// Prop is a motion a topic's members vote on, as a signed record. The former
// `author_id` and `created` are gone: the author is `user_signature.signer_id`
// and the authoring time is `user_signature.signing_time`, both signed.
message Prop {
  // Minted by the server, outside the signature: the prop's address.
  string id = 1;

  // When the server recorded the write. The server's observation.
  google.protobuf.Timestamp recorded = 2;

  PropContent content = 3;

  UserSignature user_signature = 4;

  // Held for an institutional signature; see User.
  reserved 5;
}

// PropContent is what a prop's author signs. It carries `topic_id` — a prop's
// topic is part of what it means, and every path-bound id is signed — but not
// the prop's own id, which the server mints.
message PropContent {
  // Type is what the proposition would do if it passed.
  enum Type {
    Unspecified = 0;
    Statement = 1;
    TopicQuestion = 2;
    TopicChange = 3;
    UserAdmit = 4;
    UserExpulse = 5;
    PaperExtractionComplete = 6;
    PaperIncludeMetaAnalysis = 7;
  }

  string topic_id = 1;

  Type type = 2;

  // The text of the proposition, and the text `VoteContent.citations` index
  // into.
  string description = 3;
}

// Vote is one member's position on one prop, keyed by `(propId, userId)`: a
// recast replaces the previous vote. It has no minted id — both halves of its
// key are in the signed content.
message Vote {
  // When the server recorded the vote. Overwritten on every recast, and the
  // only ordering a reader may use: `user_signature.signing_time` is the
  // voter's own claim.
  google.protobuf.Timestamp recorded = 1;

  VoteContent content = 2;

  UserSignature user_signature = 3;

  // Held for an institutional signature; see User. Vote mints no id, so its last
  // field is 3 and the number held is 4, not 5.
  reserved 4;
}

// VoteContent is what a voter signs. It carries the vote's whole key and every
// path-bound id: `prop_id`, `user_id`, `topic_id`. `user_id` repeating
// `user_signature.signer_id` is deliberate — content carries its own key — and
// refusing a record where the two disagree is persistence's; see README.md,
// "Open questions".
message VoteContent {
  enum Position {
    Unspecified = 0;
    For = 1;
    Against = 2;
    Abstain = 3;
  }

  string topic_id = 1;
  string prop_id = 2;
  string user_id = 3;

  Position position = 4;

  // Free-text rationale.
  string explanation = 5;

  // Spans of the prop's `description` the voter highlighted. Meaningful only
  // for an `Against` vote; cleared when the position changes to any other.
  repeated PropCitation citations = 6;
}

// PropCitation is a half-open character range in a prop's `description`.
message PropCitation {
  uint32 start = 1;
  uint32 end = 2;
}

message PropListRequest {
  string topic_id = 1;
}

message PropList {
  repeated Prop items = 1;
}

message PropGetRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// PropCreateRequest takes no author: it is `user_signature.signer_id`. `topic_id`
// appears both at the top level (bound from the path) and inside signed
// `content`; they must agree. See contentParam in go/server/binding.go.
message PropCreateRequest {
  string topic_id = 1;
  PropContent content = 2;
  UserSignature user_signature = 3;
}

message VoteListRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// VoteList is the only way to read a prop's votes.
message VoteList {
  repeated Vote items = 1;
}

// VoteSetRequest replaces the caller's previous vote on this prop. Both path ids
// are repeated inside signed `content` and checked against the path; see
// PropCreateRequest.
message VoteSetRequest {
  string topic_id = 1;
  string prop_id = 2;
  VoteContent content = 3;
  UserSignature user_signature = 4;
}
