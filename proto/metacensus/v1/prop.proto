// Propositions and votes: the consensus mechanism.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

service PropRoutes {
  rpc ListProps(PropListRequest) returns (PropList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop"};
  }

  rpc GetProp(PropGetRequest) returns (PropSigned) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}"};
  }

  rpc CreateProp(PropCreateRequest) returns (PropSigned) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop"
      body: "*"
    };
  }

  rpc ListVotes(VoteListRequest) returns (VoteList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}/vote"};
  }

  rpc SetVote(VoteSetRequest) returns (VoteSigned) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop/{prop_id}/vote"
      body: "*"
    };
  }
}

// A motion a topic's members vote on, as a signed record. `author_id` and
// `created` were removed: they're `user_signature.signer_id` and
// `.signing_time` now.
message PropSigned {
  // Minted by the server, outside the signature.
  string id = 1;

  // Server's observation; see UserSignature.signing_time for the author's
  // claim.
  google.protobuf.Timestamp recorded = 2;

  Prop content = 3;

  UserSignature user_signature = 4;

  // The institution's countersignature over user_signature.value; see
  // UserSigned.
  InstitutionalSignature institutional_signature = 5;

  // Held for the next signature layer — see the reserve-the-next-field rule in
  // go/contract/signing_test.go.
  reserved 6;
}

// What a prop's author signs; carries `topic_id` but not the prop's own
// server-minted id.
message Prop {
  // What the proposition would do if it passed.
  enum Type {
    Unspecified = 0;
    Statement = 1;
    TopicQuestion = 2;
    TopicChange = 3;
    UserAdmit = 4;
    UserExpulse = 5;
    PaperExtractionComplete = 6;
    PaperIncludeMetaAnalysis = 7;
  }

  string topic_id = 1;

  Type type = 2;

  // The text `Vote.citations` indexes into.
  string description = 3;
}

// One member's position on one prop, keyed by `(propId, userId)`; a second
// vote from the same user replaces the first rather than adding to it.
message VoteSigned {
  // Server's observation, and the only ordering a reader may use —
  // `user_signature.signing_time` is the voter's own claim.
  google.protobuf.Timestamp recorded = 1;

  Vote content = 2;

  UserSignature user_signature = 3;

  // The institution's countersignature over user_signature.value; see
  // UserSigned. VoteSigned mints no id, so this is 4, not 5.
  InstitutionalSignature institutional_signature = 4;

  // Held for the next signature layer — see the reserve-the-next-field rule in
  // go/contract/signing_test.go.
  reserved 5;
}

// What a voter signs. `user_id` duplicates `user_signature.signer_id` by
// design; persistence owes refusing the two when they disagree (see
// README.md, "Open questions").
message Vote {
  enum Position {
    Unspecified = 0;
    For = 1;
    Against = 2;
    Abstain = 3;
  }

  string topic_id = 1;
  string prop_id = 2;
  string user_id = 3;

  Position position = 4;

  string explanation = 5;

  // Highlighted spans of the prop's `description`; meaningful only for
  // `Against`, cleared otherwise.
  repeated PropCitation citations = 6;
}

// A half-open character range in a prop's `description`.
message PropCitation {
  uint32 start = 1;
  uint32 end = 2;
}

message PropListRequest {
  string topic_id = 1;
}

message PropList {
  repeated PropSigned items = 1;
}

message PropGetRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// No author field — that's `user_signature.signer_id`. `topic_id` is bound
// by the path and re-signed inside `content`; the two must agree.
message PropCreateRequest {
  string topic_id = 1;
  Prop content = 2;
  UserSignature user_signature = 3;
}

message VoteListRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// The only way to read a prop's votes.
message VoteList {
  repeated VoteSigned items = 1;
}

// Replaces the caller's previous vote rather than creating a new one; both
// path ids are re-signed inside `content` (see PropCreateRequest).
message VoteSetRequest {
  string topic_id = 1;
  string prop_id = 2;
  Vote content = 3;
  UserSignature user_signature = 4;
}
