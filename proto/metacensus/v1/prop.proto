// Propositions and votes: the consensus mechanism.
syntax = "proto3";

package metacensus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Prop is a motion a topic's members vote on. Propositions can be functional —
// changing the topic — or simply establish consensus among members.
message Prop {
  // Type is what the proposition would do if it passed.
  enum Type {
    Unspecified = 0;
    Statement = 1;
    TopicQuestion = 2;
    TopicChange = 3;
    UserAdmit = 4;
    UserExpulse = 5;
    PaperExtractionComplete = 6;
    PaperIncludeMetaAnalysis = 7;
  }

  string id = 1;
  string author_id = 2;
  google.protobuf.Timestamp created = 3;
  Type type = 4;

  // The text of the proposition, and the text `Vote.citations` index into.
  string description = 5;
}

// Vote is one member's position on one prop, keyed by `(propId, userId)`: a
// second vote from the same user replaces the first rather than adding to it.
message Vote {
  enum Position {
    Unspecified = 0;
    For = 1;
    Against = 2;
    Abstain = 3;
  }

  string prop_id = 1;
  string user_id = 2;
  Position position = 3;

  // Free-text rationale.
  string explanation = 4;

  // Spans of the prop's `description` the voter highlighted. Meaningful only
  // for an `Against` vote; cleared when the position changes to any other.
  repeated PropCitation citations = 5;

  // When the vote was most recently cast. Overwritten on every recast.
  google.protobuf.Timestamp last_cast = 6;
}

// PropCitation is a half-open character range in a prop's `description`.
message PropCitation {
  uint32 start = 1;
  uint32 end = 2;
}

// PropListRequest is the path parameter of `GET /topic/{topicId}/prop`.
message PropListRequest {
  string topic_id = 1;
}

// PropList is the response to `GET /topic/{topicId}/prop`.
message PropList {
  repeated Prop items = 1;
}

// PropGetRequest is the path parameters of
// `GET /topic/{topicId}/prop/{propId}`, which returns a `Prop`.
message PropGetRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// PropCreateRequest is the body of `POST /topic/{topicId}/prop`, which returns
// the created `Prop`. The author is the authenticated user and is not accepted
// in the body.
message PropCreateRequest {
  Prop.Type type = 1;
  string description = 2;
}

// VoteListRequest is the path parameters of
// `GET /topic/{topicId}/prop/{propId}/vote`.
message VoteListRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// VoteList is the response to `GET /topic/{topicId}/prop/{propId}/vote`. This
// is the only way to read a prop's votes.
message VoteList {
  repeated Vote items = 1;
}

// VoteSetRequest is the body of `POST /topic/{topicId}/prop/{propId}/vote`,
// which returns the resulting `Vote`. Set, not create: it replaces the caller's
// previous vote on this prop.
message VoteSetRequest {
  Vote.Position position = 1;
  string explanation = 2;
  repeated PropCitation citations = 3;
}
