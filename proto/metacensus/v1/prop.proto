// Propositions and votes: the consensus mechanism.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see contract/README.md.
service PropRoutes {
  rpc ListProps(ListPropsRequest) returns (PropList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop"};
  }

  rpc GetProp(GetPropRequest) returns (Prop) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}"};
  }

  rpc CreateProp(CreatePropRequest) returns (Prop) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop"
      body: "*"
    };
  }

  rpc ListVotes(ListVotesRequest) returns (VoteList) {
    option (google.api.http) = {get: "/topic/{topic_id}/prop/{prop_id}/vote"};
  }

  rpc SetVote(SetVoteRequest) returns (Vote) {
    option (google.api.http) = {
      post: "/topic/{topic_id}/prop/{prop_id}/vote"
      body: "*"
    };
  }
}

// Prop is a motion a topic's members vote on. It can be functional, changing
// the topic, or simply establish consensus.
message Prop {
  // Type is what the proposition would do if it passed.
  enum Type {
    Unspecified = 0;
    Statement = 1;
    TopicQuestion = 2;
    TopicChange = 3;
    UserAdmit = 4;
    UserExpulse = 5;
    PaperExtractionComplete = 6;
    PaperIncludeMetaAnalysis = 7;
  }

  string id = 1;
  string author_id = 2;
  google.protobuf.Timestamp created = 3;
  Type type = 4;

  // The text of the proposition, and the text `Vote.citations` index into.
  string description = 5;
}

// Vote is one member's position on one prop, keyed by `(propId, userId)`: a
// second vote from the same user replaces the first rather than adding to it.
message Vote {
  enum Position {
    Unspecified = 0;
    For = 1;
    Against = 2;
    Abstain = 3;
  }

  string prop_id = 1;
  string user_id = 2;
  Position position = 3;

  // Free-text rationale.
  string explanation = 4;

  // Spans of the prop's `description` the voter highlighted. Meaningful only
  // for an `Against` vote; cleared when the position changes to any other.
  repeated PropCitation citations = 5;

  // When the vote was most recently cast. Overwritten on every recast.
  google.protobuf.Timestamp last_cast = 6;
}

// PropCitation is a half-open character range in a prop's `description`.
message PropCitation {
  uint32 start = 1;
  uint32 end = 2;
}

message ListPropsRequest {
  string topic_id = 1;
}

message PropList {
  repeated Prop items = 1;
}

message GetPropRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// CreatePropRequest takes no author: it is the authenticated user.
message CreatePropRequest {
  string topic_id = 1;
  Prop.Type type = 2;
  string description = 3;
}

message ListVotesRequest {
  string topic_id = 1;
  string prop_id = 2;
}

// VoteList is the only way to read a prop's votes.
message VoteList {
  repeated Vote items = 1;
}

// SetVoteRequest sets rather than creates: it replaces the caller's previous
// vote on this prop.
message SetVoteRequest {
  string topic_id = 1;
  string prop_id = 2;
  Vote.Position position = 3;
  string explanation = 4;
  repeated PropCitation citations = 5;
}
