// Topics and their membership.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/protocol.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see contract/README.md.
service TopicRoutes {
  rpc ListTopics(ListTopicsRequest) returns (TopicList) {
    option (google.api.http) = {get: "/topic"};
  }

  rpc GetTopic(GetTopicRequest) returns (Topic) {
    option (google.api.http) = {get: "/topic/{topic_id}"};
  }

  rpc CreateTopic(CreateTopicRequest) returns (Topic) {
    option (google.api.http) = {
      post: "/topic"
      body: "*"
    };
  }

  rpc GetProtocol(GetProtocolRequest) returns (Protocol) {
    option (google.api.http) = {get: "/topic/{topic_id}/protocol"};
  }

  rpc ListMembers(ListMembersRequest) returns (MemberList) {
    option (google.api.http) = {get: "/topic/{topic_id}/member"};
  }

  rpc GetMember(GetMemberRequest) returns (Member) {
    option (google.api.http) = {get: "/topic/{topic_id}/member/{user_id}"};
  }
}

// Topic is a systematic review in progress.
message Topic {
  string id = 1;
  google.protobuf.Timestamp created = 2;
  string name = 3;
  string description = 4;
}

message ListTopicsRequest {}

message TopicList {
  repeated Topic items = 1;
}

message GetTopicRequest {
  string topic_id = 1;
}

message CreateTopicRequest {
  string name = 1;
  string description = 2;
}

message GetProtocolRequest {
  string topic_id = 1;
}

// Member is a user's membership of a topic. No backend implements the member
// routes yet.
message Member {
  // The member's user id, not an id of the membership itself.
  string id = 1;

  // When the user joined the topic.
  google.protobuf.Timestamp joined = 2;
}

message ListMembersRequest {
  string topic_id = 1;
}

message MemberList {
  repeated Member items = 1;
}

message GetMemberRequest {
  string topic_id = 1;
  string user_id = 2;
}
