// Topics and their membership.
syntax = "proto3";

package metacensus.v1;

import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Topic is a systematic review in progress.
message Topic {
  string id = 1;
  google.protobuf.Timestamp created = 2;
  string name = 3;
  string description = 4;
}

// TopicListRequest is the query string of `GET /topic`. No parameters.
message TopicListRequest {}

// TopicList is the response to `GET /topic`.
message TopicList {
  repeated Topic items = 1;
  ListMetadata metadata = 2;
}

// TopicGetRequest is the path parameter of `GET /topic/{topicId}`, which
// returns a `Topic`.
message TopicGetRequest {
  string topic_id = 1;
}

// TopicCreateRequest is the body of `POST /topic`, which returns the created
// `Topic`.
message TopicCreateRequest {
  string name = 1;
  string description = 2;
}

// TopicProtocolRequest is the path parameter of
// `GET /topic/{topicId}/protocol`, which returns the topic's `Protocol`.
message TopicProtocolRequest {
  string topic_id = 1;
}

// Member is a user's membership of a topic. No backend implements the member
// routes yet.
message Member {
  // The member's user id, not an id of the membership itself.
  string id = 1;

  // When the user joined the topic.
  google.protobuf.Timestamp created = 2;
}

// MemberListRequest is the path parameter of `GET /topic/{topicId}/member`.
message MemberListRequest {
  string topic_id = 1;
}

// MemberList is the response to `GET /topic/{topicId}/member`.
message MemberList {
  repeated Member items = 1;
  ListMetadata metadata = 2;
}

// MemberGetRequest is the path parameters of
// `GET /topic/{topicId}/member/{userId}`, which returns a `Member`.
message MemberGetRequest {
  string topic_id = 1;
  string user_id = 2;
}
