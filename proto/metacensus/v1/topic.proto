// Topics and their membership.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

service TopicRoutes {
  rpc ListTopics(TopicListRequest) returns (TopicList) {
    option (google.api.http) = {get: "/topic"};
  }

  rpc GetTopic(TopicGetRequest) returns (TopicSigned) {
    option (google.api.http) = {get: "/topic/{topic_id}"};
  }

  rpc CreateTopic(TopicCreateRequest) returns (TopicSigned) {
    option (google.api.http) = {
      post: "/topic"
      body: "*"
    };
  }

  rpc ListMembers(MemberListRequest) returns (MemberList) {
    option (google.api.http) = {get: "/topic/{topic_id}/member"};
  }

  rpc GetMember(MemberGetRequest) returns (Member) {
    option (google.api.http) = {get: "/topic/{topic_id}/member/{user_id}"};
  }
}

// A systematic review in progress, as a signed record.
message TopicSigned {
  // Minted by the server, outside every signature.
  string id = 1;

  // Server's observation; see Signature.time for the author's claim.
  google.protobuf.Timestamp recorded = 2;

  Topic content = 3;

  // How to read this record; sealed by both signatures below.
  Interpretation interpretation = 4;

  // The participant vouches for `content`.
  Signature user_signature = 5;

  // The institution vouches for `user_signature`; see UserSigned.
  Signature institutional_signature = 6;

  // Held for the next signature layer — see the reserve-the-next-field rule in
  // go/contract/signing_test.go.
  reserved 7;
}

// What a topic's author signs; carries no id — the server mints the
// topic's key.
message Topic {
  string name = 1;
  string description = 2;
}

message TopicListRequest {}

message TopicList {
  repeated TopicSigned items = 1;
}

message TopicGetRequest {
  string topic_id = 1;
}

message TopicCreateRequest {
  Topic content = 1;
  Interpretation interpretation = 2;
  Signature user_signature = 3;
}

// A user's membership of a topic. No backend implements the member routes
// yet, so it carries no signature.
message Member {
  // The member's user id, not an id of the membership itself.
  string id = 1;

  google.protobuf.Timestamp joined = 2;
}

message MemberListRequest {
  string topic_id = 1;
}

message MemberList {
  repeated Member items = 1;
}

message MemberGetRequest {
  string topic_id = 1;
  string user_id = 2;
}
