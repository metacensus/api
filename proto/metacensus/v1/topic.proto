// Topics and their membership.
syntax = "proto3";

package metacensus.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "metacensus/v1/common.proto";

option go_package = "github.com/metacensus/api/go/metacensus/v1;metacensusv1";

// Route declarations, not a gRPC commitment: see README.md.
service TopicRoutes {
  rpc ListTopics(TopicListRequest) returns (TopicList) {
    option (google.api.http) = {get: "/topic"};
  }

  rpc GetTopic(TopicGetRequest) returns (Topic) {
    option (google.api.http) = {get: "/topic/{topic_id}"};
  }

  rpc CreateTopic(TopicCreateRequest) returns (Topic) {
    option (google.api.http) = {
      post: "/topic"
      body: "*"
    };
  }

  rpc ListMembers(MemberListRequest) returns (MemberList) {
    option (google.api.http) = {get: "/topic/{topic_id}/member"};
  }

  rpc GetMember(MemberGetRequest) returns (Member) {
    option (google.api.http) = {get: "/topic/{topic_id}/member/{user_id}"};
  }
}

// Topic is a systematic review in progress, as a signed record: the server's
// own fields, the content its author signed, and the signature over it.
message Topic {
  // Minted by the server, outside the signature. The topic's address, not part
  // of what it means.
  string id = 1;

  // When the server recorded the write; the server's observation, outside the
  // signature. UserSignature.signing_time is the author's claim.
  google.protobuf.Timestamp recorded = 2;

  TopicContent content = 3;

  UserSignature user_signature = 4;

  // 5 is left free for an institutional signature; see User.
}

// TopicContent is what a topic's author signs. It carries no id: a topic's key
// is minted by the server, and there is no other id in scope here.
message TopicContent {
  string name = 1;
  string description = 2;
}

message TopicListRequest {}

message TopicList {
  repeated Topic items = 1;
}

message TopicGetRequest {
  string topic_id = 1;
}

message TopicCreateRequest {
  TopicContent content = 1;
  UserSignature user_signature = 2;
}

// Member is a user's membership of a topic. No backend implements the member
// routes yet, and no route writes one, so it carries no signature.
message Member {
  // The member's user id, not an id of the membership itself.
  string id = 1;

  // When the user joined the topic.
  google.protobuf.Timestamp joined = 2;
}

message MemberListRequest {
  string topic_id = 1;
}

message MemberList {
  repeated Member items = 1;
}

message MemberGetRequest {
  string topic_id = 1;
  string user_id = 2;
}
