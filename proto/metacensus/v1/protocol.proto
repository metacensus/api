// Protocols: the extraction form a topic's reviewers fill in per paper.
syntax = "proto3";

package metacensus.v1;

option go_package = "github.com/metacensus/ui/contract/go/metacensus/v1;metacensusv1";

// Protocol is an ordered set of sections, each an ordered set of elements.
message Protocol {
  string id = 1;
  string title = 2;
  repeated ProtocolSection protocol_sections = 3;
}

// ProtocolSection is a titled group of elements, ordered by `sort_order`.
message ProtocolSection {
  string id = 1;
  string title = 2;
  int32 sort_order = 3;
  repeated ProtocolElement protocol_elements = 4;
}

// ProtocolElement is one field of the extraction form.
message ProtocolElement {
  string id = 1;
  string name = 2;

  // An HTML input type, used verbatim as `<input type=…>`: `text`, `number`,
  // `date`, `textarea`, `radio` or `checkbox`.
  string type = 3;

  string label = 4;
  string placeholder = 5;
  bool required = 6;

  // Only meaningful for `radio` and `checkbox`.
  repeated ProtocolElementOption options = 7;

  int32 sort_order = 8;
}

// ProtocolElementOption is one choice of a radio or checkbox element.
message ProtocolElementOption {
  string name = 1;
  string value = 2;
}

// ProtocolTemplate is a reusable protocol a topic can start from.
message ProtocolTemplate {
  string id = 1;
  string title = 2;
  repeated ProtocolSection protocol_sections = 3;
}

// ProtocolCreateRequest ignores the ids on its sections and elements.
message ProtocolCreateRequest {
  string topic_id = 1;
  string title = 2;
  repeated ProtocolSection sections = 3;
}

// ProtocolEditRequest updates a section or element with a positive id in place;
// any other id inserts a new one. Omitting one does not delete it.
message ProtocolEditRequest {
  string protocol_id = 1;
  repeated ProtocolSection sections = 2;
}

// ProtocolTemplateListRequest carries no parameters.
message ProtocolTemplateListRequest {}

message ProtocolTemplateList {
  repeated ProtocolTemplate items = 1;
}

// ProtocolElementListRequest carries no parameters.
message ProtocolElementListRequest {}

// ProtocolElementList carries the premade elements the protocol editor offers.
// They belong to no section, so their `sort_order` is unset.
message ProtocolElementList {
  repeated ProtocolElement items = 1;
}
