version: v2

# Paths are relative to `contract/go`, where buf runs. Use `contract/Makefile`.

plugins:
  - local: [go, tool, protoc-gen-go]
    out: .
    opt:
      - paths=source_relative

  - local: ../ts/node_modules/.bin/protoc-gen-ts_proto
    out: ../ts/src
    opt:
      # These five together describe protojson output rather than protobuf
      # binary. Nothing verifies the pairing yet: metacensus/ui#49.
      - onlyTypes=true
      - useDate=string
      - stringEnums=true
      - unrecognizedEnum=false
      - forceLong=string
      # Message fields optional, scalars required — pairs with EmitDefaultValues
      # in contract/go/wire.go.
      - useOptionals=messages
      # The rpcs declare HTTP routes; a generated client interface would read as
      # a gRPC commitment.
      - outputServices=none
      # Nothing references the imported files' types: Timestamp is a string here,
      # and google.api.http is read from the descriptor, not the wire.
      - emitImportedFiles=false
      - esModuleInterop=true
      # NodeNext resolution requires extensions on relative imports.
      - importSuffix=.js

inputs:
  - directory: ../proto
