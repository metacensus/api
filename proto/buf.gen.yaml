version: v2

# Paths are relative to the repository root, where buf runs. Use the Makefile.

plugins:
  - local: bin/protoc-gen-go
    out: go
    opt:
      - paths=source_relative

  # protoc-gen-openapi (gnostic) reads the same google.api.http annotations
  # and emits one OpenAPI 3.0.3 document for the whole surface. The output file
  # name is not configurable: the plugin always writes openapi.yaml into `out`.
  - local: bin/protoc-gen-openapi
    out: openapi
    opt:
      # The wire is lowerCamelCase, so the document has to describe that and
      # not the proto's snake_case.
      - naming=json
      # Enums travel as their names, matching stringEnums in the TypeScript
      # and protojson on the Go side. The default is `integer`.
      - enum_type=string
      # Without this every operation advertises a `default` response of
      # google.rpc.Status -- {code, message, details} -- which is gRPC's error
      # shape and not the one this contract serves.
      - default_response=false
      # Neither is derivable from the .proto sources. With one document for
      # several services the plugin cannot guess a title, and its version
      # default is 0.0.1.
      - title=MetaCensus API
      - version=v1

  - local: ts/node_modules/.bin/protoc-gen-ts_proto
    out: ts/src
    opt:
      # These five together describe protojson output rather than protobuf
      # binary. Nothing verifies the pairing yet: metacensus/ui#49.
      - onlyTypes=true
      - useDate=string
      - stringEnums=true
      - unrecognizedEnum=false
      - forceLong=string
      # Message fields optional, scalars required — pairs with EmitDefaultValues
      # in go/wire.go.
      - useOptionals=messages
      # The rpcs declare HTTP routes; a generated client interface would read as
      # a gRPC commitment.
      - outputServices=none
      # Nothing references the imported files' types: Timestamp is a string here,
      # and google.api.http is read from the descriptor, not the wire.
      - emitImportedFiles=false
      - esModuleInterop=true
      # NodeNext resolution requires extensions on relative imports.
      - importSuffix=.js

inputs:
  - directory: proto
